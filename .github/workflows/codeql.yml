name: CodeQL
on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # The app project needs Xcode 27; macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: ./.github/actions/resolve-macos-packages
        id: packages
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build macOS application
        env:
          SOURCE_PACKAGES: ${{ steps.packages.outputs.path }}
        run: >-
          xcodebuild build -project Platforms/macOS/FoldGit.xcodeproj -scheme FoldGit
          -destination 'platform=macOS' -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
          -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v4
