name: CodeQL
on:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - run: xcodebuild build -project Platforms/macOS/FoldGit.xcodeproj -scheme FoldGit -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v4
