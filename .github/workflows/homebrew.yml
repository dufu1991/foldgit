name: Publish Homebrew cask

on:
  workflow_call:
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: Token with Contents read and write access to dufu1991/homebrew-tap
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require the Homebrew publishing token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure HOMEBREW_TAP_TOKEN with Contents read and write access to dufu1991/homebrew-tap before publishing.'
            exit 1
          fi
      - name: Check out the Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: dufu1991/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Test release validation
        run: python3 -m unittest discover -s Tests -p 'test_sync_foldgit.py'
      - name: Download and verify the published macOS package
        run: python3 Scripts/sync_foldgit.py
      - name: Validate the Cask syntax
        run: ruby -c Casks/foldgit.rb
      - name: Publish the Cask to the tap
        run: |
          if [ -z "$(git status --porcelain -- Casks/foldgit.rb)" ]; then
            echo 'FoldGit is already published to Homebrew.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/foldgit.rb
          git commit -m "Update FoldGit cask"
          git pull --rebase origin main
          git push origin HEAD:main
