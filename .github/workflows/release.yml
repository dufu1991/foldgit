name: Release FoldGit
# Bump the version with `python3 Scripts/version.py set X.Y.Z`, commit and push to main.
# A new version builds macOS and Windows packages and publishes the vX.Y.Z release.
on:
  push:
    branches: [main]
    paths:
      - Platforms/macOS/Configuration/Base.xcconfig
      - Platforms/Windows/src/FoldGit.App/Package.appxmanifest
      - Shared/Resources/Updates/changelog.json
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and replace the assets of a version that is already released
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      windows: ${{ steps.read.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        name: Read version and decide whether to release
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          version="$(python3 Scripts/version.py)"
          python3 Scripts/changelog.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null && [ "$REBUILD" != "true" ]; then
            echo "::notice::v$version is already released. Bump the version to publish a new release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Platforms/Windows/src/FoldGit.App/Package.appxmanifest ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Windows client is not in the repository, so only macOS is packaged."
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    # The app project needs Xcode 27; macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Require update signing key
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: test -n "$SPARKLE_EDDSA_PRIVATE_KEY"
      - name: Package ad hoc macOS application
        run: Scripts/package-macos.sh "$RUNNER_TEMP/out"
      - name: Prepare signed Sparkle update
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          sparkle_version="$(python3 -c 'import json; from pathlib import Path; p=Path("Platforms/macOS/FoldGit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"); print(next(x["state"]["version"] for x in json.loads(p.read_text())["pins"] if x["identity"] == "sparkle"))')"
          curl --fail --location --silent --show-error "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz" -o "$RUNNER_TEMP/Sparkle.tar.xz"
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  '"$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/Sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle"
          python3 Scripts/sparkle.py --app "$RUNNER_TEMP/out/FoldGit.app" \
            --archive "$RUNNER_TEMP/out/FoldGit-$VERSION-macOS-arm64.dmg" \
            --tools "$RUNNER_TEMP/Sparkle/bin" --output release
      - name: Verify update authentication and tamper rejection
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_TOOLS_DIRECTORY: ${{ runner.temp }}/Sparkle/bin
          FOLDGIT_SPARKLE_TEST_APP: ${{ runner.temp }}/out/FoldGit.app
          FOLDGIT_SPARKLE_TEST_ARCHIVE: ${{ runner.temp }}/out/FoldGit-${{ env.VERSION }}-macOS-arm64.dmg
        run: python3 -m unittest discover -s Scripts/tests -p 'test_sparkle.py'

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' && needs.version.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHITECTURE: ${{ matrix.architecture }}
      CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Platforms/Windows/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows build dependencies
        run: python -m pip install -r Scripts/build-requirements.txt

      # Optional Authenticode signing uses the existing certificate secrets.
      # Without a certificate, publish an unsigned EXE installer.
      - name: Prepare signing certificate
        if: env.CERTIFICATE != ''
        id: certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfx
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Inno Setup signature validation failed.' }
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:RUNNER_TEMP/InnoSetup") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Platforms/Windows/Packaging/installer.ps1 -Architecture $env:ARCHITECTURE -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}' -CompilerPath "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer "release/FoldGit-Windows-$env:ARCHITECTURE.exe"

      - name: Verify installation and application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'FoldGit-installed'
          $setup = Start-Process "release/FoldGit-Windows-$env:ARCHITECTURE.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed with exit code $($setup.ExitCode)." }
          $app = Start-Process "$install/FoldGit.App.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed application exited with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id
          $uninstall = Start-Process "$install/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item 'Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}' -DeleteKey -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [version, macos, windows]
    if: >-
      always() && needs.version.outputs.release == 'true' && needs.macos.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Validate assets and write release notes
        run: |
          test -f release/FoldGit-macOS-arm64.dmg
          test -s release/appcast.xml
          expected=2
          if [ "${{ needs.version.outputs.windows }}" = "true" ]; then
            test -f release/FoldGit-Windows-x64.exe
            test -f release/FoldGit-Windows-ARM64.exe
            expected=4
          fi
          test "$(find release -type f | wc -l | tr -d ' ')" = "$expected"
          python3 Scripts/changelog.py --release "$VERSION" > notes.md
          {
            echo
            echo '## SHA-256'
            echo
            echo '```text'
            (cd release && shasum -a 256 *)
            echo '```'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FoldGit ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: "true"
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Summarize Homebrew synchronization
        run: |
          {
            echo '### Homebrew'
            echo 'The tap checks the latest stable release every 6 hours and verifies the macOS package before updating the Cask. GitHub scheduling may delay a run.'
            echo 'No personal access token is required in FoldGit.'
            echo '[View or manually run Sync FoldGit](https://github.com/dufu1991/homebrew-tap/actions/workflows/foldgit.yml)'
          } >> "$GITHUB_STEP_SUMMARY"
