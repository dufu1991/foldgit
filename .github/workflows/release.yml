name: Release FoldGit
# Bump the version with `python3 Scripts/version.py set X.Y.Z`, commit and push to main.
# A new version builds macOS and Windows packages and publishes the vX.Y.Z release.
on:
  push:
    branches: [main]
    paths:
      - Platforms/macOS/Configuration/Base.xcconfig
      - Platforms/Windows/src/FoldGit.App/Package.appxmanifest
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and replace the assets of a version that is already released
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      windows: ${{ steps.read.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        name: Read version and decide whether to release
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          version="$(python3 Scripts/version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null && [ "$REBUILD" != "true" ]; then
            echo "::notice::v$version is already released. Bump the version to publish a new release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Platforms/Windows/src/FoldGit.App/Package.appxmanifest ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Windows client is not in the repository, so only macOS is packaged."
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Without Developer ID secrets the app is ad hoc signed and users clear the quarantine flag once.
      SIGNED: ${{ secrets.APPLE_TEAM_ID != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package with ad hoc signing
        if: env.SIGNED != 'true'
        run: |
          Scripts/package-macos.sh "$RUNNER_TEMP/out"
          mkdir -p release
          cp "$RUNNER_TEMP/out/FoldGit-$VERSION-macOS-arm64.dmg" "$RUNNER_TEMP/out/FoldGit-$VERSION-macOS-arm64.zip" release/

      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/FoldGit.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/FoldGit.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/FoldGit.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Archive and export with Developer ID
        if: env.SIGNED == 'true'
        run: |
          xcodebuild archive -project Platforms/macOS/FoldGit.xcodeproj -scheme FoldGit -configuration Release \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -archivePath "$RUNNER_TEMP/FoldGit.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Developer ID Application"
          cp Platforms/macOS/Configuration/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FoldGit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          test "$(lipo -archs "$RUNNER_TEMP/export/FoldGit.app/Contents/MacOS/FoldGit")" = arm64

      - name: Notarize, staple and build the DMG
        if: env.SIGNED == 'true'
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          app="$RUNNER_TEMP/export/FoldGit.app"
          name="FoldGit-$VERSION-macOS-arm64"
          mkdir -p release
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$app"
          ditto -c -k --keepParent "$app" "release/$name.zip"
          mkdir -p "$RUNNER_TEMP/dmg"
          ditto "$app" "$RUNNER_TEMP/dmg/FoldGit.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname FoldGit -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "release/$name.dmg"
          codesign --sign "Developer ID Application" --timestamp "release/$name.dmg"
          xcrun notarytool submit "release/$name.dmg" --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "release/$name.dmg"

      - name: Remove temporary keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/FoldGit.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' && needs.version.outputs.windows == 'true'
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHITECTURE: ${{ matrix.architecture }}
      CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Platforms/Windows/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MSIX must be signed to install. Use the WINDOWS_CERTIFICATE_* secrets when present;
      # otherwise sign with a throwaway self-signed certificate and ship its public .cer.
      - name: Prepare signing certificate
        id: certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$manifest = Get-Content Platforms/Windows/src/FoldGit.App/Package.appxmanifest
          $publisher = $manifest.Package.Identity.Publisher
          if ($env:CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            Remove-Item $pfx
          } else {
            $certificate = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
              -FriendlyName 'FoldGit release' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          }
          if ($certificate.Subject -ne $publisher) { throw "Certificate subject $($certificate.Subject) must equal $publisher." }
          New-Item -ItemType Directory -Force release | Out-Null
          Export-Certificate -Cert $certificate -FilePath "release/FoldGit-$env:VERSION-Windows-$env:ARCHITECTURE.cer" | Out-Null
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build and sign MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Platforms/Windows/Packaging/package.ps1 -Architecture $env:ARCHITECTURE -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'
          $package = $output | Select-Object -Last 1
          Copy-Item $package "release/FoldGit-$env:VERSION-Windows-$env:ARCHITECTURE.msix"

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item 'Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}' -DeleteKey -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [version, macos, windows]
    if: >-
      always() && needs.version.outputs.release == 'true' && needs.macos.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MAC_SIGNED: ${{ secrets.APPLE_TEAM_ID != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' }}
      WINDOWS_TRUSTED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          (cd release && shasum -a 256 * > SHA256SUMS.txt)
          {
            echo "## Install"
            echo
            echo "**macOS** (Apple Silicon, macOS 26 or later): open \`FoldGit-$VERSION-macOS-arm64.dmg\` and drag FoldGit into Applications."
            if [ "$MAC_SIGNED" != "true" ]; then
              echo "This build is not signed with an Apple Developer certificate. If macOS says it is damaged or cannot be verified, run once:"
              echo
              echo '```sh'
              echo 'xattr -dr com.apple.quarantine /Applications/FoldGit.app'
              echo '```'
            fi
            if ls release/*.msix > /dev/null 2>&1; then
              echo
              echo "**Windows** (Windows 11 24H2 or later): the Windows client is a minimal implementation; contributions are welcome."
              echo "Download the \`.msix\` and \`.cer\` for your architecture (x64 or ARM64)."
              if [ "$WINDOWS_TRUSTED" != "true" ]; then
                echo "The package is signed with a self-signed certificate. Trust it once in an administrator PowerShell, then open the \`.msix\`:"
                echo
                echo '```powershell'
                echo "Import-Certificate -FilePath .\\FoldGit-$VERSION-Windows-x64.cer -CertStoreLocation Cert:\\LocalMachine\\TrustedPeople"
                echo '```'
              fi
            fi
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FoldGit ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
