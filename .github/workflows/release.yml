name: Release FoldGit
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$TEAM_ID"
          echo -n "$CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/FoldGit.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/FoldGit.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/FoldGit.keychain-db"
      - name: Archive and export
        run: |
          xcodebuild archive -project Platforms/macOS/FoldGit.xcodeproj -scheme FoldGit -configuration Release -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO -archivePath "$RUNNER_TEMP/FoldGit.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Developer ID Application"
          cp Platforms/macOS/Configuration/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FoldGit.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          test "$(lipo -archs "$RUNNER_TEMP/export/FoldGit.app/Contents/MacOS/FoldGit")" = arm64
          ditto -c -k --keepParent "$RUNNER_TEMP/export/FoldGit.app" FoldGit.zip
      - name: Notarize and staple
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          xcrun notarytool submit FoldGit.zip --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$RUNNER_TEMP/export/FoldGit.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/FoldGit.app" FoldGit.zip
          shasum -a 256 FoldGit.zip > Checksum.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FoldGit.zip
            Checksum.txt
          draft: true
          generate_release_notes: true
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/FoldGit.keychain-db" || true
