name: Release FoldGit
# Bump the version with `python3 Scripts/version.py set X.Y.Z`, commit and push to main.
# A new version builds macOS and Windows packages and publishes the vX.Y.Z release.
on:
  push:
    branches: [main]
    paths:
      - Platforms/macOS/Configuration/Base.xcconfig
      - Platforms/Windows/src/FoldGit.App/Package.appxmanifest
      - website/changelog.json
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and replace the assets of a version that is already released
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      windows: ${{ steps.read.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        name: Read version and decide whether to release
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          version="$(python3 Scripts/version.py)"
          python3 Scripts/changelog.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null && [ "$REBUILD" != "true" ]; then
            echo "::notice::v$version is already released. Bump the version to publish a new release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Platforms/Windows/src/FoldGit.App/Package.appxmanifest ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Windows client is not in the repository, so only macOS is packaged."
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    # The app project needs Xcode 27; macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Without Developer ID secrets the app is ad hoc signed and users clear the quarantine flag once.
      SIGNED: ${{ secrets.APPLE_TEAM_ID != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Package with ad hoc signing
        if: env.SIGNED != 'true'
        run: |
          Scripts/package-macos.sh "$RUNNER_TEMP/out"
          mkdir -p release
          cp "$RUNNER_TEMP/out/FoldGit-$VERSION-macOS-arm64.dmg" release/FoldGit-macOS-arm64.dmg

      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/FoldGit.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/FoldGit.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/FoldGit.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/FoldGit.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Archive and export with Developer ID
        if: env.SIGNED == 'true'
        run: |
          xcodebuild archive -project Platforms/macOS/FoldGit.xcodeproj -scheme FoldGit -configuration Release \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -archivePath "$RUNNER_TEMP/FoldGit.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Developer ID Application"
          cp Platforms/macOS/Configuration/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FoldGit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          test "$(lipo -archs "$RUNNER_TEMP/export/FoldGit.app/Contents/MacOS/FoldGit")" = arm64

      - name: Notarize, staple and build the DMG
        if: env.SIGNED == 'true'
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          app="$RUNNER_TEMP/export/FoldGit.app"
          mkdir -p release
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$app"
          mkdir -p "$RUNNER_TEMP/dmg"
          ditto "$app" "$RUNNER_TEMP/dmg/FoldGit.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname FoldGit -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "release/FoldGit-macOS-arm64.dmg"
          codesign --sign "Developer ID Application" --timestamp "release/FoldGit-macOS-arm64.dmg"
          xcrun notarytool submit "release/FoldGit-macOS-arm64.dmg" --apple-id "$AC_USERNAME" --password "$AC_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "release/FoldGit-macOS-arm64.dmg"

      - name: Remove temporary keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/FoldGit.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' && needs.version.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHITECTURE: ${{ matrix.architecture }}
      CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Platforms/Windows/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Optional Authenticode signing uses the existing certificate secrets.
      # Without a certificate, publish an unsigned EXE installer.
      - name: Prepare signing certificate
        if: env.CERTIFICATE != ''
        id: certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $pfx
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Inno Setup signature validation failed.' }
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:RUNNER_TEMP/InnoSetup") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Platforms/Windows/Packaging/installer.ps1 -Architecture $env:ARCHITECTURE -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}' -CompilerPath "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer "release/FoldGit-Windows-$env:ARCHITECTURE.exe"

      - name: Verify installation and application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'FoldGit-installed'
          $setup = Start-Process "release/FoldGit-Windows-$env:ARCHITECTURE.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed with exit code $($setup.ExitCode)." }
          $app = Start-Process "$install/FoldGit.App.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Installed application exited with code $($app.ExitCode)." }
          Stop-Process -Id $app.Id
          $uninstall = Start-Process "$install/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item 'Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}' -DeleteKey -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [version, macos, windows]
    if: >-
      always() && needs.version.outputs.release == 'true' && needs.macos.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Validate assets and write release notes
        run: |
          test -f release/FoldGit-macOS-arm64.dmg
          expected=1
          if [ "${{ needs.version.outputs.windows }}" = "true" ]; then
            test -f release/FoldGit-Windows-x64.exe
            test -f release/FoldGit-Windows-ARM64.exe
            expected=3
          fi
          test "$(find release -type f | wc -l | tr -d ' ')" = "$expected"
          python3 Scripts/changelog.py --release "$VERSION" > notes.md
          {
            echo
            echo '## SHA-256'
            echo
            echo '```text'
            (cd release && shasum -a 256 *)
            echo '```'
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FoldGit ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: "true"
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true

  homebrew:
    name: Publish Homebrew cask
    needs: publish
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/homebrew.yml
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
