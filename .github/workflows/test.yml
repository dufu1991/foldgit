name: Test FoldGit
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
      - website/**
      - Shared/Resources/Updates/**
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
      - website/**
      - Shared/Resources/Updates/**
      - .github/ISSUE_TEMPLATE/**
permissions:
  contents: read
jobs:
  shared-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install script test dependencies
        run: python3 -m pip install -r Scripts/build-requirements.txt
      - name: Validate module boundaries
        run: |
          python3 Scripts/check-platform-boundaries.py
          python3 Scripts/validate-localizations.py
          python3 Scripts/version.py
          python3 Scripts/changelog.py --check
          python3 -m unittest discover -s Scripts/tests -p 'test_*.py'
      - name: Test shared core
        run: swift test --force-resolved-versions
  shared-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Test shared core
        run: swift test --force-resolved-versions
  macos-app:
    # The app project needs Xcode 27; macos-26 tops out at Xcode 26.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Test macOS application
        run: >-
          xcodebuild test -project Platforms/macOS/FoldGit.xcodeproj -scheme FoldGit
          -destination 'platform=macOS' -derivedDataPath build/macos
          -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO
      - name: Validate compiler-extracted localization keys
        run: python3 Scripts/validate-localizations.py --extracted-directory build/macos/Build/Intermediates.noindex/FoldGit.build
