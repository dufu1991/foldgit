name: Website build
on:
  push:
    branches: [main]
    paths:
      - website/**
      - Shared/Resources/Branding/Images/**
      - Shared/Resources/Updates/**
      - Scripts/build-website.py
      - Scripts/build-requirements.txt
      - Scripts/changelog.py
      - Scripts/version.py
      - Scripts/tests/test_website.py
      - Platforms/macOS/Configuration/Base.xcconfig
      - Platforms/Windows/src/FoldGit.App/Package.appxmanifest
      - Platforms/Windows/src/FoldGit.App/MainWindow.Dialogs.cs
      - .github/workflows/website.yml
  pull_request:
    branches: [main]
    paths:
      - website/**
      - Shared/Resources/Branding/Images/**
      - Shared/Resources/Updates/**
      - Scripts/build-website.py
      - Scripts/build-requirements.txt
      - Scripts/changelog.py
      - Scripts/version.py
      - Scripts/tests/test_website.py
      - Platforms/macOS/Configuration/Base.xcconfig
      - Platforms/Windows/src/FoldGit.App/Package.appxmanifest
      - Platforms/Windows/src/FoldGit.App/MainWindow.Dialogs.cs
      - .github/workflows/website.yml
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r Scripts/build-requirements.txt
      - name: Verify website build
        run: python -m unittest discover -s Scripts/tests -p 'test_website.py'
      - name: Build deployable website
        run: python Scripts/build-website.py
      - name: Verify source tree
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/website/
          if-no-files-found: error
