name: FoldGit
options:
  minimumXcodeGenVersion: 2.45.0
  xcodeVersion: "27.1"
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja, ko, ru, fr, es, Base]
packages:
  FoldGitShared:
    path: ../..
  HighlightSwift:
    path: ../../Vendor/HighlightSwift
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FoldGit:
    productName: FoldGit
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - path: Sources
      - path: Resources
        excludes: [Previews, MaterialFileIcons]
      # A folder reference keeps the icons as plain SVG files in one bundle subdirectory.
      - path: ../../Shared/Resources/FileIcons/MaterialFileIcons
        type: folder
        buildPhase: resources
      - path: ../../Shared/Resources/FileIcons/MaterialFileIcons.json
        buildPhase: resources
      - path: ../../Shared/Resources/Licenses/LICENSE.txt
        buildPhase: resources
      - path: ../../Shared/Resources/Branding/AppIcon.icon
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Configuration/FoldGit.entitlements
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: Configuration/FoldGit-Info.plist
    dependencies:
      - package: FoldGitShared
        product: FoldGitCore
      - package: HighlightSwift
        product: HighlightSwift
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Generate localizations
        script: python3 "$SRCROOT/../../Scripts/generate-resources.py" macos "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        # Each catalog is listed because a directory input only tracks the directory's own timestamp.
        inputFiles:
          - $(SRCROOT)/../../Scripts/generate-resources.py
          - $(SRCROOT)/../../Shared/Resources/Localization/en.json
          - $(SRCROOT)/../../Shared/Resources/Localization/zh-Hans.json
          - $(SRCROOT)/../../Shared/Resources/Localization/zh-Hant.json
          - $(SRCROOT)/../../Shared/Resources/Localization/ja.json
          - $(SRCROOT)/../../Shared/Resources/Localization/ko.json
          - $(SRCROOT)/../../Shared/Resources/Localization/ru.json
          - $(SRCROOT)/../../Shared/Resources/Localization/fr.json
          - $(SRCROOT)/../../Shared/Resources/Localization/es.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/en.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/zh-Hans.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/zh-Hans.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/zh-Hant.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/zh-Hant.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ja.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ja.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ko.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ko.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ru.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ru.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/fr.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/fr.lproj/Localizable.stringsdict
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/es.lproj/Localizable.strings
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/es.lproj/Localizable.stringsdict
  FoldGitTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/DebugSigning.xcconfig
    sources:
      - path: Tests
        excludes: [UITests]
    dependencies:
      - target: FoldGit
      - package: FoldGitShared
        product: FoldGitTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dufu.foldgit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  FoldGit:
    build:
      targets:
        FoldGit: all
        FoldGitTests: [test]
    test:
      targets:
        - name: FoldGitTests
          parallelizable: false
      environmentVariables:
        FOLDGIT_TESTING: "1"
      gatherCoverageData: true
