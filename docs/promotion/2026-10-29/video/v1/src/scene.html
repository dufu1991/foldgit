<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FoldGit Promo</title>
<style>
  :root {
    --bg: #f4f6fa;
    --ink: #0d1020;
    --muted: #5d6679;
    --faint: #8a93a6;
    --accent: #0a6cf0;
    --W: 1920px;
    --H: 1080px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); }
  body {
    font-family: "SF Pro Display", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern";
  }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(1200px 800px at 50% 38%, #ffffff 0%, rgba(255,255,255,0) 70%),
      radial-gradient(900px 600px at 82% 90%, rgba(10,108,240,0.07), rgba(10,108,240,0) 70%),
      var(--bg);
  }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform, filter; }
  em { font-style: normal; color: var(--accent); }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  /* S1 */
  .say { font-size: 76px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; max-width: 1600px; text-wrap: balance; }
  #s1 .say + .say { margin-top: 28px; }

  /* S2 */
  #s2text { position: absolute; left: 0; right: 0; top: 84px; }
  #s2text .say { font-size: 60px; }
  #s2text .say + .say { margin-top: 6px; }
  #ides { position: absolute; left: 50%; top: 668px; width: 0; height: 0; }
  .ide { position: absolute; width: 780px; height: 440px; margin: -220px 0 0 -390px; border-radius: 16px;
    background: #e7eaf0; border: 1px solid rgba(13,16,32,0.10);
    box-shadow: 0 30px 60px -20px rgba(13,16,32,0.28), 0 2px 6px rgba(13,16,32,0.06); overflow: hidden; }
  .ide .bar { height: 40px; background: #dde1e8; border-bottom: 1px solid rgba(13,16,32,0.08); display: flex; align-items: center; padding: 0 16px; gap: 8px; }
  .ide .bar i { width: 12px; height: 12px; border-radius: 50%; background: #c3c8d1; }
  .ide .bar b { flex: 1; height: 10px; margin: 0 120px 0 40px; border-radius: 5px; background: #cfd4dc; }
  .ide .side { position: absolute; left: 0; top: 40px; bottom: 28px; width: 150px; background: #dfe3ea; padding: 18px 14px; }
  .ide .side s, .ide .code s { display: block; height: 9px; border-radius: 5px; background: #c9ced7; margin-bottom: 14px; text-decoration: none; }
  .ide .code { position: absolute; left: 170px; right: 220px; top: 62px; }
  .ide .panel { position: absolute; right: 0; top: 40px; bottom: 28px; width: 200px; background: #e1e5eb; border-left: 1px solid rgba(13,16,32,0.06); }
  .ide .status { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: #d6dbe3; display: flex; align-items: center; gap: 12px; padding: 0 14px; font: 500 14px "SF Pro Text", -apple-system, "PingFang SC", sans-serif; color: #6c7586; }
  .ide .prog { width: 160px; height: 6px; border-radius: 3px; background: #c2c8d2; overflow: hidden; }
  .ide .prog u { display: block; height: 100%; width: 30%; background: #8d96a8; }
  .ide .spin { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -12px; border-radius: 50%;
    border: 6px solid rgba(13,16,32,0.12); border-top-color: rgba(13,16,32,0.45); }
  #beach { position: absolute; width: 46px; height: 46px; border-radius: 50%;
    background: conic-gradient(#ff3b30, #ff9500, #ffcc00, #34c759, #0a84ff, #5e5ce6, #ff2d55, #ff3b30);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(0,0,0,0.15); opacity: 0; }
  #foldline { position: absolute; left: 50%; top: 668px; width: 1100px; height: 3px; margin-left: -550px; margin-top: -1.5px; border-radius: 2px; background: var(--accent); opacity: 0;
    box-shadow: 0 0 24px rgba(10,108,240,0.55); }

  /* S3 */
  .icon { width: 280px; height: 280px; filter: drop-shadow(0 30px 40px rgba(10,60,160,0.25)); }
  .brand { font-size: 112px; font-weight: 700; letter-spacing: -0.03em; margin-top: 18px; }
  .tagline { font-size: 52px; font-weight: 600; margin-top: 18px; letter-spacing: -0.005em; }
  .sub { font-size: 32px; font-weight: 500; color: var(--muted); margin-top: 18px; }

  /* S4 */
  #s4 { perspective: 2200px; }
  #show { position: absolute; left: 50%; top: 50%; width: 1560px; border-radius: 26px; transform-origin: 50% 100%;
    box-shadow: 0 60px 120px -30px rgba(13,30,80,0.45), 0 8px 24px rgba(13,30,80,0.12); }

  /* S5 */
  #frame { position: absolute; left: 140px; top: 70px; width: 1640px; height: 844px; border-radius: 22px; overflow: hidden;
    background: #eef1f5; border: 1px solid rgba(13,16,32,0.10);
    box-shadow: 0 50px 100px -30px rgba(13,30,80,0.35), 0 4px 14px rgba(13,30,80,0.08); }
  #frame img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #caps { position: absolute; left: 0; right: 0; top: 950px; height: 80px; }
  .cap { position: absolute; left: 0; right: 0; top: 0; font-size: 44px; font-weight: 600; text-align: center; opacity: 0; text-wrap: balance; }

  /* S6 */
  #pillars { display: grid; grid-template-columns: repeat(4, 410px); gap: 0; }
  .pillar { padding: 0 24px; text-align: center; opacity: 0; }
  .pillar + .pillar { border-left: 1px solid rgba(13,16,32,0.12); }
  .pillar h2 { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .pillar p { font-size: 24px; font-weight: 500; color: var(--muted); margin-top: 16px; line-height: 1.4; text-wrap: balance; }
  #closing { font-size: 50px; font-weight: 600; margin-top: 110px; opacity: 0; text-wrap: balance; max-width: 1500px; line-height: 1.3; }

  /* S7 */
  #s7 .icon { width: 220px; height: 220px; }
  #s7 .brand { font-size: 96px; margin-top: 10px; }
  .url { font-size: 46px; font-weight: 600; color: var(--accent); margin-top: 36px; letter-spacing: -0.005em; }
  .gh { font-size: 30px; font-weight: 500; color: var(--muted); margin-top: 14px; font-family: "SF Mono", ui-monospace, Menlo, monospace; }
  .meta { font-size: 24px; font-weight: 500; color: var(--faint); margin-top: 44px; }

  /* 竖屏 */
  body.v .say { font-size: 84px; max-width: 900px; }
  body.v #s2text { top: 200px; }
  body.v #s2text .say { font-size: 64px; }
  body.v #ides { top: 1120px; transform: scale(0.8); }
  body.v #foldline { top: 1120px; width: 900px; margin-left: -450px; }
  body.v .icon { width: 300px; height: 300px; }
  body.v .brand { font-size: 128px; }
  body.v .tagline { font-size: 60px; max-width: 900px; text-wrap: balance; line-height: 1.25; }
  body.v .sub { font-size: 36px; max-width: 900px; }
  body.v #show { width: 1000px; border-radius: 20px; }
  body.v #frame { left: 40px; top: 300px; width: 1000px; height: 1180px; border-radius: 28px; }
  body.v #caps { top: 1560px; }
  body.v .cap { font-size: 52px; padding: 0 60px; line-height: 1.25; }
  body.v #pillars { grid-template-columns: repeat(2, 470px); row-gap: 90px; }
  body.v .pillar:nth-child(3) { border-left: 0; }
  body.v .pillar h2 { font-size: 76px; }
  body.v .pillar p { font-size: 28px; }
  body.v #closing { font-size: 58px; max-width: 900px; margin-top: 140px; }
  body.v #s7 .icon { width: 260px; height: 260px; }
  body.v #s7 .brand { font-size: 112px; }
  body.v .url { font-size: 56px; }
  body.v .gh { font-size: 32px; }
  body.v .meta { font-size: 28px; }
</style>
</head>
<body>
<div id="stage">
  <section id="s1" class="layer center"><div class="say" id="l1"></div><div class="say" id="l2"></div></section>

  <section id="s2" class="layer">
    <div id="s2text" class="center"><div class="say" id="i1"></div><div class="say" id="i2"></div></div>
    <div id="ides"></div>
    <div id="foldline"></div>
  </section>

  <section id="s3" class="layer center">
    <img class="icon" id="s3icon" src="../../../../../Shared/Resources/Branding/Images/FoldGit.png">
    <div class="brand" id="s3brand">FoldGit</div>
    <div class="tagline" id="s3tag"></div>
    <div class="sub" id="s3sub"></div>
  </section>

  <section id="s4" class="layer"><img id="show"></section>

  <section id="s5" class="layer">
    <div id="frame"><img id="shotL"><img id="shotD"></div>
    <div id="caps"></div>
  </section>

  <section id="s6" class="layer center"><div id="pillars"></div><div id="closing"></div></section>

  <section id="s7" class="layer center">
    <img class="icon" id="s7icon" src="../../../../../Shared/Resources/Branding/Images/FoldGit.png">
    <div class="brand" id="s7brand">FoldGit</div>
    <div class="url" id="s7url">foldgit.com</div>
    <div class="gh" id="s7gh">github.com/dufu1991/foldgit</div>
    <div class="meta" id="s7meta"></div>
  </section>
</div>
<script src="copy.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const LANG = Q.get("lang") || "zh";
const V = (Q.get("ratio") || "16x9") === "9x16";
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const C = JSON.parse(JSON.stringify(COPY[LANG]), (k, v) => (typeof v === "string" ? v.replace(/\n/g, V ? "<br>" : LANG === "zh" ? "" : " ") : v));
const ROOT = "../../../../../website/assets/";
document.documentElement.style.setProperty("--W", W + "px");
document.documentElement.style.setProperty("--H", H + "px");
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
if (V) document.body.classList.add("v");

const $ = (id) => document.getElementById(id);
$("l1").innerHTML = C.line1;
$("l2").innerHTML = C.line2;
$("i1").innerHTML = C.ide1;
$("i2").innerHTML = C.ide2;
$("s3tag").innerHTML = C.tagline;
$("s3sub").innerHTML = C.sub;
$("s7meta").innerHTML = C.meta;
$("closing").innerHTML = C.closing;
$("show").src = `${ROOT}showcases/main-${LANG}-light@2x.webp`;
$("shotL").src = `${ROOT}screenshots/main-${LANG}-light@2x.webp`;
$("shotD").src = `${ROOT}screenshots/main-${LANG}-dark@2x.webp`;
C.captions.forEach((c) => { const d = document.createElement("div"); d.className = "cap"; d.innerHTML = c; $("caps").appendChild(d); });
C.pillars.forEach(([h, p]) => { const d = document.createElement("div"); d.className = "pillar"; d.innerHTML = `<h2>${h}</h2><p>${p}</p>`; $("pillars").appendChild(d); });

// 杂乱的 IDE 窗口
const IDE_N = 6;
const ideOffsets = V
  ? [[-150, -330], [130, -210], [-110, -60], [150, 70], [-130, 200], [60, 330]]
  : [[-430, -70], [390, -90], [-270, 60], [310, 80], [-50, -10], [90, 110]];
for (let i = 0; i < IDE_N; i++) {
  const d = document.createElement("div");
  d.className = "ide";
  const code = Array.from({ length: 8 }, (_, k) => `<s style="width:${[78, 55, 66, 40, 72, 50, 61, 34][k]}%"></s>`).join("");
  const side = Array.from({ length: 7 }, (_, k) => `<s style="width:${[80, 60, 70, 50, 74, 58, 66][(k + i) % 7]}%"></s>`).join("");
  d.innerHTML = `<div class="bar"><i></i><i></i><i></i><b></b></div><div class="side">${side}</div><div class="code">${code}</div><div class="panel"></div><div class="spin"></div><div class="status"><span>${C.ideStatus[i]}</span><span class="prog"><u></u></span></div>`;
  $("ides").appendChild(d);
}
const beach = document.createElement("div");
beach.id = "beach";
$("ides").appendChild(beach);

// ---------- 时间工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x) => { const c = 1.25; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

// 进入 + 退出的标准文字动效：模糊淡入上移，退出淡出
function reveal(el, t, tin, tout, dist = 28) {
  const a = eExpo(prog(t, tin, tin + 0.9));
  const b = tout == null ? 0 : eOut(prog(t, tout, tout + 0.45));
  el.style.opacity = a * (1 - b);
  el.style.transform = `translateY(${(1 - a) * dist - b * 14}px)`;
  el.style.filter = a < 1 ? `blur(${(1 - a) * 10}px)` : "none";
}
const show = (el, o) => { el.style.opacity = o; };
const active = (t, a, b) => t >= a && t < b;

// 截图镜头：在原图坐标（比例）中框选区域
const IW = 3840, IH = 1976;
const REG = V
  ? { full: [0, 0, 1, 1], side: [0, 0.07, 0.17, 0.3], graph: [0.135, 0.1, 0.17, 0.6], diff: [0.645, 0.2, 0.355, 0.26] }
  : { full: [0, 0, 1, 1], side: [0, 0.07, 0.17, 0.3], graph: [0.135, 0.1, 0.17, 0.36], diff: [0.31, 0.18, 0.62, 0.28] };
const CAM = [[18.0, "full"], [18.35, "full"], [19.15, "side"], [19.95, "side"], [20.75, "graph"], [21.6, "graph"], [22.4, "diff"], [30, "diff"]];
function camRect(t) {
  for (let i = 0; i < CAM.length - 1; i++) {
    const [ta, ra] = CAM[i], [tb, rb] = CAM[i + 1];
    if (t <= tb) { const x = eInOut(prog(t, ta, tb)); return REG[ra].map((v, k) => lerp(v, REG[rb][k], x)); }
  }
  return REG.diff;
}
function placeShot(t) {
  const fw = V ? 1000 : 1640, fh = V ? 1180 : 844;
  const [rx, ry, rw, rh] = camRect(t);
  const s = Math.min(fw / (rw * IW), fh / (rh * IH));
  let tx = fw / 2 - (rx + rw / 2) * IW * s;
  let ty = fh / 2 - (ry + rh / 2) * IH * s;
  const sw = IW * s, sh = IH * s;
  tx = sw >= fw ? clamp(tx, fw - sw, 0) : (fw - sw) / 2;
  ty = sh >= fh ? clamp(ty, fh - sh, 0) : (fh - sh) / 2;
  for (const id of ["shotL", "shotD"]) $(id).style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
}

// ---------- 主渲染 ----------
function render(t) {
  // S1 0–8
  const s1 = $("s1");
  show(s1, active(t, 0, 8.2) ? 1 : 0);
  if (active(t, 0, 8.2)) {
    reveal($("l1"), t, 0.35, 7.45);
    reveal($("l2"), t, 3.5, 7.45);
    $("l1").style.opacity *= lerp(1, 0.35, eOut(prog(t, 3.5, 4.3)));
  }

  // S2 8–12.2
  const s2 = $("s2");
  show(s2, active(t, 7.9, 12.4) ? 1 : 0);
  if (active(t, 7.9, 12.4)) {
    reveal($("i1"), t, 8.0, 10.9);
    reveal($("i2"), t, 8.25, 10.9);
    const fold = eInOut(prog(t, 10.95, 11.65));
    const ides = $("ides");
    ides.style.transform = `${V ? "scale(0.8) " : ""}scaleY(${lerp(1, 0.004, fold)})`;
    ides.style.opacity = 1 - prog(t, 11.55, 11.7);
    [...ides.querySelectorAll(".ide")].forEach((d, i) => {
      const a = eBack(prog(t, 8.45 + i * 0.32, 8.95 + i * 0.32));
      const [ox, oy] = ideOffsets[i];
      const drift = Math.sin(t * 0.7 + i) * 4;
      d.style.opacity = clamp(prog(t, 8.45 + i * 0.32, 8.7 + i * 0.32));
      d.style.transform = `translate(${ox}px, ${oy + (1 - a) * 60 + drift}px) scale(${lerp(0.9, 1, a)}) rotate(${(i % 2 ? 1 : -1) * 0.6}deg)`;
      d.querySelector(".spin").style.transform = `rotate(${t * 360 * 1.1 + i * 50}deg)`;
      d.querySelector(".prog u").style.width = `${12 + 70 * (0.5 + 0.5 * Math.sin(t * 0.9 + i * 1.3)) * prog(t, 8.5 + i * 0.32, 11)}%`;
    });
    const bOn = prog(t, 10.1, 10.3);
    beach.style.opacity = bOn;
    const [bx, by] = V ? [220, 380] : [300, 240];
    beach.style.left = `${bx}px`; beach.style.top = `${by}px`;
    beach.style.transform = `rotate(${t * 720}deg)`;
    const line = $("foldline");
    line.style.opacity = prog(t, 11.45, 11.6) * (1 - prog(t, 12.05, 12.2));
    const shrink = eInOut(prog(t, 11.65, 12.1));
    line.style.transform = `scaleX(${lerp(1, 0.003, shrink)})`;
  }

  // S3 12–15.1
  const s3 = $("s3");
  show(s3, active(t, 11.95, 15.2) ? 1 : 0);
  if (active(t, 11.95, 15.2)) {
    const ic = $("s3icon");
    const a = prog(t, 11.95, 12.75);
    const out = eOut(prog(t, 14.6, 15.1));
    ic.style.opacity = clamp(a * 2.2) * (1 - out);
    ic.style.transform = `translateY(${-out * 40}px) scale(${lerp(0.35, 1, eBack(a))})`;
    ic.style.filter = `blur(${(1 - eOut(a)) * 14}px) drop-shadow(0 30px 40px rgba(10,60,160,0.25))`;
    reveal($("s3brand"), t, 12.55, 14.6);
    reveal($("s3tag"), t, 12.95, 14.6);
    reveal($("s3sub"), t, 13.3, 14.6);
  }

  // S4 15–18.2：展示图立起
  const s4 = $("s4");
  show(s4, active(t, 14.9, 18.4) ? 1 : 0);
  if (active(t, 14.9, 18.4)) {
    const a = eExpo(prog(t, 14.95, 16.9));
    const img = $("show");
    const w = V ? 1000 : 1560, h = w * 2488 / 4352;
    img.style.marginLeft = `${-w / 2}px`;
    img.style.marginTop = `${-h / 2}px`;
    const settle = eInOut(prog(t, 16.9, 18.0));
    img.style.opacity = clamp(prog(t, 14.95, 15.55)) * (1 - prog(t, 17.85, 18.2));
    img.style.transform = `translateY(${(1 - a) * 220}px) rotateX(${(1 - a) * 48}deg) scale(${lerp(0.84, 1, a) * lerp(1, 1.035, settle)})`;
  }

  // S5 17.85–24.1：镜头推近
  const s5 = $("s5");
  show(s5, active(t, 17.8, 24.2) ? 1 : 0);
  if (active(t, 17.8, 24.2)) {
    const a = eOut(prog(t, 17.85, 18.25));
    const out = eOut(prog(t, 23.7, 24.1));
    const fr = $("frame");
    fr.style.opacity = a * (1 - out);
    fr.style.transform = `scale(${lerp(0.985, 1, a) * lerp(1, 0.96, out)})`;
    placeShot(t);
    $("shotD").style.opacity = eInOut(prog(t, 22.75, 23.35));
    const caps = [...document.querySelectorAll(".cap")];
    const ct = [[18.95, 19.95], [20.55, 21.6], [22.2, 23.7]];
    caps.forEach((c, i) => reveal(c, t, ct[i][0], ct[i][1], 18));
  }

  // S6 24–27.2
  const s6 = $("s6");
  show(s6, active(t, 23.95, 27.4) ? 1 : 0);
  if (active(t, 23.95, 27.4)) {
    [...document.querySelectorAll(".pillar")].forEach((p, i) => reveal(p, t, 24.1 + i * 0.38, 26.85, 36));
    reveal($("closing"), t, 25.75, 26.85);
  }

  // S7 27.1–30
  const s7 = $("s7");
  show(s7, t >= 27.05 ? 1 : 0);
  if (t >= 27.05) {
    const ic = $("s7icon");
    const a = prog(t, 27.1, 27.85);
    ic.style.opacity = clamp(a * 2);
    ic.style.transform = `scale(${lerp(0.6, 1, eBack(a))})`;
    ic.style.filter = `blur(${(1 - eOut(a)) * 10}px) drop-shadow(0 30px 40px rgba(10,60,160,0.25))`;
    reveal($("s7brand"), t, 27.4);
    reveal($("s7url"), t, 27.75);
    reveal($("s7gh"), t, 27.95);
    reveal($("s7meta"), t, 28.2);
  }
}
window.render = render;
window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = i.onerror = r; }))),
]).then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => { render(0); return true; });

// 浏览器内预览：?t=12.3 定格，或 ?play=1 实时播放
if (Q.get("t")) window.ready.then(() => render(parseFloat(Q.get("t"))));
if (Q.get("play")) window.ready.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % 30); requestAnimationFrame(loop); }; loop(); });
</script>
</body>
</html>
