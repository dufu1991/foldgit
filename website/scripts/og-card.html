<!doctype html>
<!-- Open Graph card template, exported to assets/og.png by render-showcases.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: url(../assets/wallpapers/landscape-light.webp) center / cover;
  }
  .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(244, 247, 255, 0.94) 0, rgba(244, 247, 255, 0.86) 36%, rgba(244, 247, 255, 0) 52%);
  }
  .copy {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 72px;
    width: 440px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .brand img { width: 84px; height: 84px; }
  .brand span { font-size: 46px; font-weight: 700; letter-spacing: -0.02em; color: #10131c; }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 700; letter-spacing: -0.025em; color: #10131c; }
  h1 em { font-style: normal; color: #0a6cf0; }
  p { margin-top: 24px; font-size: 22px; font-weight: 500; color: #4a5160; }
  /* Enlarge the sidebar and commit graph so they stay legible at card size. */
  .shot {
    position: absolute;
    top: 96px;
    left: 560px;
    width: 2200px;
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(20, 40, 90, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.08);
  }
</style>
</head>
<body>
  <img class="shot" src="../assets/screenshots/main-en-light@2x.webp" alt="">
  <div class="veil"></div>
  <div class="copy">
    <div class="brand"><img src="../assets/icon.webp" alt=""><span>FoldGit</span></div>
    <h1>Every repository, <em>folded into one window.</em></h1>
    <p>Native Git client for macOS</p>
  </div>
</body>
</html>
