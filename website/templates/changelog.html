  <script>
    (() => {
      var root = document.documentElement, store = {};
      try { store.lang = localStorage.getItem("foldgit.lang"); store.theme = localStorage.getItem("foldgit.theme"); } catch (e) {}
      var first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
      var lang = store.lang === "zh" || store.lang === "en" ? store.lang : (first.toLowerCase().indexOf("zh") === 0 ? "zh" : "en");
      root.dataset.lang = lang;
      root.lang = lang === "zh" ? "zh-CN" : "en";
      if (store.theme === "light" || store.theme === "dark") root.dataset.theme = store.theme;
      root.dataset.mode = root.dataset.theme || "auto";
      root.dataset.scheme = root.dataset.theme || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
